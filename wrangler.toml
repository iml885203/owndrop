name = "owndrop"
main = "server/adapters/cf/worker.ts"
compatibility_date = "2025-05-01"
# Resolve public preview URLs through Cloudflare's public routes, including same-zone Workers.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

# Leave database_id unset so "Deploy to Cloudflare" auto-provisions D1 and R2.
[[d1_databases]]
binding = "DB"
database_name = "owndrop-db"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "owndrop-files"

[triggers]
crons = ["0 3 * * *"]

[vars]
OWNDROP_RETENTION_DAYS = "90"
OWNDROP_MAX_FILE_MB = "90"
OWNDROP_MAX_PRESIGNED_FILE_MB = "512"
OWNDROP_MAX_STORAGE_MB = "8192"
OWNDROP_SESSION_DAYS = "180"
