<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="OwnDrop 雙環境統一架構圖">
  <defs>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#70b8ff" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#909090" />
    </marker>
    <style>
      .sans { font-family: "Avenir Next", "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1120" height="430" rx="14" fill="#111111" />
  <rect x="0.75" y="0.75" width="1118.5" height="428.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Title -->
  <text x="560" y="38" text-anchor="middle" fill="#eeeeee" font-size="18" font-weight="700" class="sans">
    雙環境統一架構（Cloudflare 免費原生 + Docker 自架）
  </text>
  <text x="560" y="58" text-anchor="middle" fill="#909090" font-size="12.5" class="sans">
    同一套 Hono TypeScript 核心，透過極薄儲存介面同時相容 $0 Cloudflare Workers 與單容器自架
  </text>

  <!-- Column 1: Clients -->
  <g transform="translate(36, 84)">
    <rect width="272" height="314" rx="12" fill="#191919" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="20" y="28" fill="#909090" font-size="11" font-weight="700" letter-spacing="0.06em" class="sans">零開網頁客戶端</text>

    <rect x="16" y="46" width="240" height="74" rx="8" fill="#111111" stroke="#3a3a3a" stroke-width="1" />
    <text x="30" y="72" fill="#eeeeee" font-size="14" font-weight="600" class="sans">Raycast Extension</text>
    <text x="30" y="92" fill="#b4b4b4" font-size="12" class="sans">macOS &amp; Windows 全域快捷鍵</text>
    <text x="30" y="109" fill="#70b8ff" font-size="11" class="mono">Bearer owd_...</text>

    <rect x="16" y="134" width="240" height="74" rx="8" fill="#111111" stroke="#3a3a3a" stroke-width="1" />
    <text x="30" y="160" fill="#eeeeee" font-size="14" font-weight="600" class="sans">Apple 捷徑</text>
    <text x="30" y="180" fill="#b4b4b4" font-size="12" class="sans">iPhone 分享選單與動作按鈕</text>
    <text x="30" y="197" fill="#70b8ff" font-size="11" class="mono">Bearer owd_...</text>

    <rect x="16" y="222" width="240" height="74" rx="8" fill="#111111" stroke="#3a3a3a" stroke-width="1" />
    <text x="30" y="248" fill="#eeeeee" font-size="14" font-weight="600" class="sans">Web PWA / CLI</text>
    <text x="30" y="268" fill="#b4b4b4" font-size="12" class="sans">歷史搜尋、釘選、管理裝置</text>
    <text x="30" y="285" fill="#909090" font-size="11" class="mono">Cookie / Bearer</text>
  </g>

  <!-- Column 2: OwnDrop Core -->
  <g transform="translate(394, 84)">
    <rect width="316" height="314" rx="12" fill="#191919" stroke="#70b8ff" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="20" y="28" fill="#70b8ff" font-size="11" font-weight="700" letter-spacing="0.06em" class="sans">OWNDROP 共用核心</text>
    <text x="20" y="54" fill="#eeeeee" font-size="18" font-weight="700" class="sans">Hono + TypeScript API</text>

    <rect x="18" y="72" width="280" height="78" rx="8" fill="#111111" stroke="#3a3a3a" stroke-width="1" />
    <text x="32" y="96" fill="#eeeeee" font-size="13" font-weight="600" class="sans">認證與安全層</text>
    <text x="32" y="116" fill="#b4b4b4" font-size="11.5" class="sans">• 密碼登入 + 可撤銷持久化 Session</text>
    <text x="32" y="135" fill="#b4b4b4" font-size="11.5" class="sans">• 標準 OIDC (PKCE S256) · 多裝置 Token</text>

    <rect x="18" y="162" width="280" height="72" rx="8" fill="#111111" stroke="#3a3a3a" stroke-width="1" />
    <text x="32" y="186" fill="#eeeeee" font-size="13" font-weight="600" class="sans">REST API 與檔案串流</text>
    <text x="32" y="206" fill="#70b8ff" font-size="11" class="mono">/api/items · /latest · /files/:id</text>
    <text x="32" y="223" fill="#b4b4b4" font-size="11.5" class="sans">防 SSRF 連結預覽 · Range 206 下載</text>

    <rect x="18" y="246" width="280" height="50" rx="8" fill="#111111" stroke="#ffffff" stroke-opacity="0.2" stroke-dasharray="4 3" />
    <text x="158" y="268" text-anchor="middle" fill="#eeeeee" font-size="12" font-weight="600" class="sans">極薄儲存介面層（各約 80 行）</text>
    <text x="158" y="285" text-anchor="middle" fill="#909090" font-size="11" class="mono">DbAdapter (SQLite) · BlobStore</text>
  </g>

  <!-- Column 3 Top: Cloudflare Native -->
  <g transform="translate(796, 84)">
    <rect width="288" height="190" rx="12" fill="#191919" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2" />
    <text x="20" y="28" fill="#f0c76f" font-size="11" font-weight="700" letter-spacing="0.06em" class="sans">主力 · CLOUDFLARE 免費方案 ($0/月)</text>
    <text x="20" y="52" fill="#eeeeee" font-size="15.5" font-weight="700" class="sans">Cloudflare Workers + Assets</text>

    <rect x="16" y="66" width="124" height="50" rx="8" fill="#111111" stroke="#3a3a3a" />
    <text x="28" y="88" fill="#eeeeee" font-size="12.5" font-weight="600" class="sans">D1 資料庫</text>
    <text x="28" y="105" fill="#909090" font-size="11" class="sans">5 GB SQLite 免費</text>

    <rect x="148" y="66" width="124" height="50" rx="8" fill="#111111" stroke="#3a3a3a" />
    <text x="160" y="88" fill="#eeeeee" font-size="12.5" font-weight="600" class="sans">R2 物件儲存</text>
    <text x="160" y="105" fill="#909090" font-size="11" class="sans">10 GB · 零流量費</text>

    <rect x="16" y="126" width="256" height="48" rx="8" fill="#111111" stroke="#3a3a3a" />
    <text x="28" y="147" fill="#eeeeee" font-size="12" font-weight="600" class="sans">Presigned 大檔直傳 + Cron 清理</text>
    <text x="28" y="164" fill="#909090" font-size="11" class="sans">&gt;90 MB 直傳 R2 · 8 GB 上限防爆額度</text>
  </g>

  <!-- Column 3 Bottom: Docker Self-Host -->
  <g transform="translate(796, 288)">
    <rect width="288" height="110" rx="12" fill="#191919" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="5 4" />
    <text x="20" y="27" fill="#909090" font-size="11" font-weight="700" letter-spacing="0.06em" class="sans">選配 · DOCKER 自架模式</text>
    <text x="20" y="51" fill="#eeeeee" font-size="15" font-weight="600" class="sans">單一 Node.js 22 容器</text>
    <text x="20" y="74" fill="#b4b4b4" font-size="12" class="sans">內建 node:sqlite（免原生編譯）</text>
    <text x="20" y="93" fill="#b4b4b4" font-size="12" class="sans">本地 /data 磁碟卷 + 每小時自動清理</text>
  </g>

  <!-- Arrows -->
  <line x1="308" y1="167" x2="386" y2="167" stroke="#70b8ff" stroke-width="1.8" marker-end="url(#arrowAccent)" />
  <line x1="308" y1="255" x2="386" y2="255" stroke="#70b8ff" stroke-width="1.8" marker-end="url(#arrowAccent)" />
  <line x1="308" y1="343" x2="386" y2="343" stroke="#70b8ff" stroke-width="1.8" marker-end="url(#arrowAccent)" />
  <text x="351" y="156" text-anchor="middle" fill="#b4b4b4" font-size="10.5" font-weight="600" class="sans">HTTPS</text>

  <path d="M 710 185 L 788 185" fill="none" stroke="#70b8ff" stroke-width="2" marker-end="url(#arrowAccent)" />
  <text x="752" y="174" text-anchor="middle" fill="#f0c76f" font-size="10.5" font-weight="700" class="sans">CF 原生</text>

  <path d="M 710 343 L 788 343" fill="none" stroke="#909090" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowMuted)" />
  <text x="752" y="332" text-anchor="middle" fill="#909090" font-size="10.5" font-weight="600" class="sans">Docker</text>
</svg>
